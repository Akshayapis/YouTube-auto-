name: Kaggle AI Video Pipeline

on:
  schedule:
    - cron: '30 1 * * *'  # 7:00 AM IST
    - cron: '30 12 * * *' # 6:00 PM IST
  workflow_dispatch:

jobs:
  trigger-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install kaggle requests

      - name: Authenticate and Push to Kaggle
        env:
          KAGGLE_USERNAME: "akshaysbjfj"
          KAGGLE_KEY: "0898301a73cf7fd67d6e94c7c3f2af87"
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO_NAME: ${{ github.repository }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          
          # Purana queued kernel cancel karke naya push karein
          kaggle kernels push -p .
