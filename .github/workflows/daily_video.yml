name: AI Video Builder Pipeline

on:
  schedule:
    - cron: '30 1 * * *'  # Subah 7:00 AM IST (01:30 UTC)
    - cron: '30 12 * * *' # Shaam 6:00 PM IST (12:30 UTC)
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run AI Video Generator Script
        env:
          VIDEO_PROMPT: "Pahale in dono img ko deko ek ek krke dono ko to jante hoge instagram youTube pr 1 no pr hey aur dono k video kise kise hote hey bahut tip ki hote hey ok..."
          IMAGE_URL_1: "https://i.ibb.co/PvvnF4Ss/1794655006382.png"
          IMAGE_URL_2: "https://i.ibb.co/jvj0BxYP/1794654866543.png"
        run: |
          python app.py

      - name: Commit and Push Results to GitHub
        run: |
          git config --global user.name "AI Video Bot"
          git config --global user.email "bot@github.com"
          git add generated_prompt.txt
          git commit -m "Auto-generated video prompt and metadata for dashboard [skip ci]" || echo "No changes to commit"
          git push
