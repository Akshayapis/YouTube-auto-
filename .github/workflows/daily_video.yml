name: AI Video Builder Pipeline

on:
  schedule:
    - cron: '30 1 * * *'  # Subah 7:00 AM IST (01:30 UTC)
    - cron: '30 12 * * *' # Shaam 6:00 PM IST (12:30 UTC)
  workflow_dispatch:

jobs:
  run-kaggle-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kaggle CLI
        run: |
          pip install kaggle

      - name: Authenticate Kaggle
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${{ secrets.KAGGLE_USERNAME }}\",\"key\":\"${{ secrets.KAGGLE_KEY }}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Run Kaggle Notebook / Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_PROMPT: "Pahale in dono img ko deko ek ek krke dono ko to jante hoge instagram youTube pr 1 no pr hey aur dono k video kise kise hote hey bahut tip ki hote hey ok. To es dono mine koi ek slict karo jis ka es time pr video baht play ho ok air fir 40s ka txt tip krdo ok bhai best ho ek dam best Story ok and 8k quality air iise img mi hey vise carictar ok bhai bahut kucch ho ok bahut log ho ok alg alg tum ko pata hoga best txt promt do"
          IMAGE_URL_1: "https://i.ibb.co/PvvnF4Ss/1794655006382.png"
          IMAGE_URL_2: "https://i.ibb.co/jvj0BxYP/1794654866543.png"
        run: |
          python -m pip install google-genai requests
          python app.py
